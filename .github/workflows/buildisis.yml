        echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> arch/arm64/configs/peridot_defconfig
        echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/peridot_defconfig
        echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/peridot_defconfig
        echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/peridot_defconfig
        echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/peridot_defconfig
        echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/peridot_defconfig
        if [ "${{ github.event.inputs.KERNELSU_OPTION }}" == "4" ]; then
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> arch/arm64/configs/peridot_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/peridot_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/peridot_defconfig
        else
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> arch/arm64/configs/peridot_defconfig
        fi
        echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/peridot_defconfig
        echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/peridot_defconfig

    - name: Config Kernel Name
      run: |
        cd ${{ steps.kernel.outputs.kernel-folder }}
        CURRENT_DATE=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
        perl -pi -e "s{UTS_VERSION=\"\\\$\\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_DATE\"}" ./scripts/mkcompile_h
        sed -i '$s|echo "\$res"|echo "\$res-@NoFloresto"|' ./scripts/setlocalversion
        sed -i 's/-dirty//' ./scripts/setlocalversion

    - name: Building kernel
      run: |
        cd ${{ steps.kernel.outputs.kernel-folder }}
        export PATH="${{ steps.tools.outputs.tools-folder }}:$PATH"
        export LD_LIBRARY_PATH=${{ steps.tools.outputs.tools-folder }}/../lib64:$LD_LIBRARY_PATH
        export KBUILD_COMPILER_STRING=$(${{ steps.tools.outputs.tools-folder }}/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
        export KBUILD_LINKER_STRING=$(${{ steps.tools.outputs.tools-folder }}/ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')
        DATE=$(date '+%Y%m%d-%H%M')
        OUT_DIR=out/
        VERSION="agmad-isis-${{ github.event.inputs.CODENAME }}-${DATE}-@NoFloresto"
        if [[ -z "${KEBABS}" ]]; then
            COUNT="$(grep -c '^processor' /proc/cpuinfo)"
            export KEBABS="$COUNT"
        fi
        echo "Jobs: ${KEBABS}"
        ARGS="ARCH=arm64 \
              O=${OUT_DIR} \
              CC=clang \
              LD=ld.lld \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              LLVM=1 \
              LTO=full \
              -j${KEBABS}"
        START=$(date +"%s")
        echo "------ Starting Compilation ------"
        make -j${KEBABS} ${ARGS} peridot_defconfig
        cd ${OUT_DIR}
        make -j${KEBABS} ${ARGS} CC="ccache clang" HOSTCC="ccache gcc" HOSTCXX="ccache g++" olddefconfig
        cd ..
        make -j${KEBABS} ${ARGS} CC="ccache clang" HOSTCC="ccache gcc" HOSTCXX="ccache g++" 2>&1 | tee build.log
        echo "------ Finishing Build ------"
        END=$(date +"%s")
        DIFF=$((END - START))
        if [ -f "out/arch/arm64/boot/Image" ]; then
            cd ${{ steps.workspace.outputs.workspace-folder }}
            cp ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/Image AnyKernel3/Image
            cd AnyKernel3
            zip -r9 "../${VERSION}.zip" * -x '*.git*' README.md *placeholder
            cd ..
            rm -rf AnyKernel3
            echo "Completed in $((DIFF / 60)) minute(s) and $((DIFF % 60)) second(s) !"
            echo "zipname=${VERSION}.zip" >> $GITHUB_OUTPUT
        else
            echo "Compilation Failed!"
            exit 1
        fi
      id: build

    - name: Upload to Release
      if: ${{ github.event.inputs.UPLOAD_TO_RELEASE == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.workspace.outputs.workspace-folder }}/${{ steps.build.outputs.zipname }}
        name: ${{ github.event.inputs.CODENAME }}-${{ steps.build_date.outputs.build_date }}
        tag_name: ${{ github.event.inputs.CODENAME }}-${{ steps.build_date.outputs.build_date }}
        body: |
          <b>Kernel Build Succeeded</b> ✅
          <b>${{ steps.workspace.outputs.build_title }}</b>
          <b>Kernel successfully built!</b>, took $(( ${{ steps.build.outputs.elapsed_time}} / 60 )) minute(s) and $(( ${{ steps.build.outputs.elapsed_time}} % 60 )) second(s).
          <b>📱 Device Codename</b>: <code>${{ github.event.inputs.CODENAME }}</code>
          <b>Kernel tree</b>: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}
          <b>Action</b>: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          <b>Workflow File</b>: ${{ github.workflow }}.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      id: upload_release

    - name: Create GoFile upload script
      run: |
        echo '#!/bin/bash' > upload_gofile.sh
        echo '' >> upload_gofile.sh
        echo 'if [[ "$#"  ==  '\''0'\'' ]]; then' >> upload_gofile.sh
        echo 'echo  -e '\''ERROR: No File Specified!'\'' && exit 1' >> upload_gofile.sh
        echo 'fi' >> upload_gofile.sh
        echo 'FILE="@$1"' >> upload_gofile.sh
        echo 'SERVER=$(curl -s https://api.gofile.io/servers | jq -r '\''.data.servers[0].name'\'')' >> upload_gofile.sh
        echo 'LINK=$(curl -# -F file=${FILE} https://${SERVER}.gofile.io/uploadFile | jq -r '\''.data|.downloadPage'\'') 2>&1' >> upload_gofile.sh
        echo 'echo $LINK' >> upload_gofile.sh
        chmod +x upload_gofile.sh
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Rename Kernel ZIP for GoFile
      run: |
        BUILD_TIME_SUFFIX=$(date +"%Y%m%d%H%M%S")
        mv ${{ steps.workspace.outputs.workspace-folder }}/${{ steps.build.outputs.zipname }} ${{ steps.workspace.outputs.workspace-folder }}/${{ github.event.inputs.CODENAME }}-${{ steps.build_date.outputs.build_date }}-${BUILD_TIME_SUFFIX}.zip
        echo "BUILD_TIME_SUFFIX=${BUILD_TIME_SUFFIX}" >> $GITHUB_ENV
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Upload Kernel ZIP to GoFile
      id: upload_gofile
      run: |
        ./upload_gofile.sh ${{ steps.workspace.outputs.workspace-folder }}/${{ github.event.inputs.CODENAME }}-${{ steps.build_date.outputs.build_date }}-${{ env.BUILD_TIME_SUFFIX }}.zip > gofile_link.txt
        FILE_URL=$(cat gofile_link.txt)
        echo "FILE_URL=${FILE_URL}" >> $GITHUB_ENV
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Notify Build Success
      if: ${{ success() && github.event.inputs.NOTIFY_SUCCESS == 'true' }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ github.event.inputs.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: html
        message: |
          <b>Kernel Build Succeeded</b> ✅
          🔧 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a>
          <b>📦 Build Title</b>: <code>${{ steps.workspace.outputs.build_title }}</code>
          <b>📱 Device Codename</b>: <code>${{ github.event.inputs.CODENAME }}</code>
          <b>📄 Files</b>: <code>${{ steps.build.outputs.zipname }}</code>
          <b>🔗 GoFile Download Link</b>: <a href="${{ env.FILE_URL }}">Download</a>
        files: |
          ${{ steps.workspace.outputs.workspace-folder }}/${{ steps.build.outputs.zipname }}
